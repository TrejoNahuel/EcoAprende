<div class="card h-100 shadow-sm border-0 border-top border-4 border-success rounded-4 transition-card" style="cursor: pointer;">
    <div class="card-body d-flex flex-column p-4">
        <!-- Opcional: Un pequeño indicador o icono ecológico -->
        <div class="mb-2 text-success">
            <i class="bi bi-eco"></i> <!-- Puedes usar Bootstrap Icons si los tienes -->
        </div>
        <h5 class="card-title fw-bold text-success-emphasis">{{ module.title }}</h5>
        <p class="card-text text-secondary flex-grow-1">{{ module.description }}</p>
        
        <!-- Opcional: Un enlace o indicador de acción -->
        <a [routerLink]="['/modules', module.id, 'lessons']" class="mt-3 text-success fw-semibold small d-flex align-items-center text-decoration-none">
            Explorar módulo <span class="ms-1">&rarr;</span>
        </a>
    </div>
</div>
