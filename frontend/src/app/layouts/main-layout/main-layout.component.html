<div class="container-fluid vh-100 overflow-hidden">
  <div class="row h-100">
    <!-- SIDEBAR (Izquierda) -->
    <nav class="col-md-3 col-lg-2 d-md-flex bg-light border-end p-3 flex-column justify-content-between">
      <app-sidebar></app-sidebar>
    </nav>
    <!-- CONTENIDO PRINCIPAL (Derecha) -->
    <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 d-flex flex-column h-100 bg-white">
      <!-- HEADER -->
      <app-header [title]="currentTitle"></app-header>
      <!-- ÁREA DINÁMICA -->
      <div class="flex-grow-1 overflow-auto px-2">
        <router-outlet></router-outlet>
      </div>

    </main>
  </div>
</div>
