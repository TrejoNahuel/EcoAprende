<div class="container mt-4" *ngIf="profile$ | async as profile; else loading">
  <h2 class="mb-4">Panel del Estudiante</h2>
  
  <div class="card shadow-sm mb-4 border-0 bg-light">
    <div class="card-body d-flex justify-content-between align-items-center">
      <div>
        <h5 class="card-title text-success mb-1">¡Hola, {{ profile.email }}!</h5>
        <p class="text-muted mb-0">Miembro EcoAprende</p>
      </div>
      
      <!-- Badges de Bootstrap para Nivel y Puntos -->
      <div class="text-end">
        <span class="badge rounded-pill bg-success fs-6 me-2 px-3 py-2">
          ⭐ {{ profile.level.name }}
        </span>
        <span class="badge rounded-pill bg-primary fs-6 px-3 py-2">
          ⚡ {{ profile.points }} XP
        </span>
      </div>
    </div>
  </div>

  <!-- Contenedores preparados para las próximas tareas (T056 y T057) -->
  <div class="row">
    <div class="col-12 mb-4">
      <!-- Aquí irá el componente de Progreso (TargetProgress) -->
    </div>
    <div class="col-12">
      <!-- Aquí irá la Vitrina de Insignias -->
       <div class="card shadow-sm border-0 bg-light mt-2">
        <div class="card-body">
          <h5 class="card-title text-success mb-4">🏅 Vitrina de Insignias</h5>

          <!-- Nos suscribimos al observable de insignias -->
          <ng-container *ngIf="badges$ | async as badges">
            
            <!-- Caso A: El usuario TIENE insignias ganadas -->
            <div class="d-flex flex-wrap gap-3" *ngIf="badges.length > 0; else noBadges">
              <span *ngFor="let badge of badges" class="badge text-bg-success fs-6 p-3 shadow-sm rounded-pill d-flex align-items-center">
                <span class="fs-4 me-2">🏅</span> 
                <div class="text-start">
                  <span class="d-block">{{ badge.name }}</span>
                  <small class="fw-light" *ngIf="badge.earnedAt" style="font-size: 0.75rem;">
                    {{ badge.earnedAt | date:'shortDate' }}
                  </small>
                </div>
              </span>
            </div>

            <!-- Caso B: El usuario NO TIENE insignias (Estado vacío) -->
            <ng-template #noBadges>
              <div class="alert alert-warning border-0 rounded-3 text-center mb-0" role="alert">
                Todavía no desbloqueaste insignias — completá misiones para ganarlas.
              </div>
            </ng-template>

          </ng-container>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Pantalla de carga mientras responde el backend -->
<ng-template #loading>
  <div class="text-center mt-5">
    <div class="spinner-border text-success" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
  </div>
</ng-template>
